services:

  blazegraph:
    image: gridappsd/blazegraph:develop
    container_name: blazegraph_cim_loader
    ports:
      - 8889:8080

  neo4j-apoc:
    image: neo4j:5.26-community
    container_name: neo4j_cim_loader
    ports:
      - 7474:7474
      - 7687:7687
    environment:
      # Install APOC and neosemantics (n10s) plugins
      - NEO4J_PLUGINS=["apoc","n10s"]
      - NEO4J_AUTH=none
      - NEO4J_dbms_memory_transaction_total_max=10g
      - NEO4J_server_memory_heap_max__size=10g
      # APOC configuration
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      # n10s configuration
      - NEO4J_dbms_unmanaged__extension__classes=n10s.endpoint=/rdf
      # Security settings to allow procedures
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,n10s.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,n10s.*
    volumes:
      - ./docker/neo4j/data:/data
      - ./docker/neo4j/plugins:/plugins

  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:latest
    container_name: oxigraph_cim_loader
    ports:
      - 7878:7878
    volumes:
      - ./docker/oxigraph:/data
    command: serve --location /data --bind 0.0.0.0:7878

  graphdb:
    image: ontotext/graphdb:11.3.2
    container_name: graphdb_cim_loader
    ports:
      - 7200:7200
    volumes:
      - ./docker/graphdb:/opt/graphdb/home
