[tool.poetry]
name = "cim-loader"
version = "0.0.2a0"
description = "CIM Database Uploader & Downloader"
authors = ["A. Anderson <19935503+AAndersn@users.noreply.github.com>"]
packages = [
    { include = "cimloader" }
]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

cim-graph = "^0.3.2a2"

[tool.poetry.extras]
gridappsd = ["gridappsd-python"]

[tool.poetry.group.dev.dependencies]
pre-commit = "^2.17.0"
graphviz = "^0.19.1"
ipykernel = "^6.25.1"


[build-system]
requires = ["poetry-core>=1.2.0"]
build-backend = "poetry.core.masonry.api"