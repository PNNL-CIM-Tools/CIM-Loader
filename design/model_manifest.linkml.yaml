id: https://gridappsd.org/cimhub/model-manifest
name: model-manifest
title: CIM Model Provenance Manifest
description: >-
  Schema for the model-provenance manifest that catalogs golden feeder models,
  their distribution as IEC 61970-557 OpenXML (.cimx) packages, and their
  fetch sources. Slots are SKOS-mapped to the IEC 61970-552 metadata profile
  (Dataset / GridDataset / Activity) so the manifest is a forward-compatible
  profile of the standard's own provenance vocabulary.

  NOTE: this schema is the CONTRACT and documentation. The runtime loader in
  `cimloader` parses the conforming YAML with plain pyyaml into dataclasses and
  does NOT depend on linkml/linkml-runtime. Validating an instance against this
  schema is an optional CI step in the catalog repo (Powergrid-Models), where
  this schema and the `models.yaml` instance are intended to live.

prefixes:
  linkml: https://w3id.org/linkml/
  manifest: https://gridappsd.org/cimhub/model-manifest/
  md: http://iec.ch/TC57/61970-552/ModelDescription/3#   # IEC 61970-552 metadata profile
  cim: http://cim.ucaiug.io/ns#
  dcat: http://www.w3.org/ns/dcat#
  dcterms: http://purl.org/dc/terms/
  spdx: http://spdx.org/rdf/terms#

default_prefix: manifest
default_range: string

imports:
  - linkml:types

classes:

  ModelEntry:
    description: One feeder model in the catalog.
    class_uri: cim:GridDataset
    exact_mappings:
      - cim:GridDataset
    slots:
      - id
      - family
      - version
      - golden_format
      - golden_direction
      - feeder_mrid
      - doi
      - parts

  Part:
    description: >-
      One physical artifact in a model's distribution. Maps to an OPC package
      part (IEC 61970-557) and to dcat:Distribution. Identity is `id` +
      `checksum`, never `filename` (557 §4.5: filenames carry no meaning).
    class_uri: dcat:Distribution
    exact_mappings:
      - dcat:Distribution
    slots:
      - id
      - profile
      - content_type
      - filename
      - checksum
      - sources
      - external

slots:

  id:
    description: Stable identifier. For a Part this is the persistent OPC relationship Id (557 §4.4).
    identifier: true
    required: true

  family:
    description: Provenance grouping; one family = one Zenodo record / DOI. Maps to the publisher authority.
    exact_mappings:
      - dcterms:publisher
    required: true

  version:
    description: Catalog version of the model.
    exact_mappings:
      - dcterms:hasVersion

  golden_format:
    description: Which serialization is authoritative for this model.
    range: GoldenFormatEnum

  golden_direction:
    description: >-
      Whether the native format or the CIM is the trusted reference, driving how
      cross-format tests assert.
    range: GoldenDirectionEnum

  feeder_mrid:
    description: The CIM Feeder mRID for the model.

  doi:
    description: Citation DOI for the family/version (may be absent, e.g. OEDI-hosted).

  parts:
    description: The physical artifacts comprising the distribution.
    range: Part
    multivalued: true
    inlined_as_list: true
    required: true

  profile:
    description: CGMES-style profile of this part (combined, EQ, SSH, SV, TP, OP, ...). Maps to cim:GridDataset.profileType.
    exact_mappings:
      - cim:GridDataset.profileType
    ifabsent: string(combined)

  content_type:
    description: IANA/IETF-registered media type of the part (557 §4.6). Maps to dcat:mediaType.
    exact_mappings:
      - dcat:mediaType
    ifabsent: string(application/rdf+xml)

  filename:
    description: Convenience filename only — NOT identity (557 §4.5). Maps to dcat:accessURL when it is a path.
    close_mappings:
      - dcat:accessURL

  checksum:
    description: '"<algo>:<hex>" digest; the fetch-resolve key. Maps to spdx:checksum.'
    exact_mappings:
      - spdx:checksum
    required: true

  sources:
    description: Ordered fetch URLs; firewall-free mirror first, upstream after. Maps to dcat:accessURL.
    exact_mappings:
      - dcat:accessURL
    multivalued: true
    required: true

  external:
    description: True when the part lives off-package (OPC TargetMode="External").
    range: boolean
    ifabsent: 'False'

enums:

  GoldenFormatEnum:
    permissible_values:
      dss:
        description: OpenDSS is the authoritative serialization.
        meaning: dcterms:format
      raw:
        description: PSS/E RAW is the authoritative serialization.
        meaning: dcterms:format
      glm:
        description: GridLAB-D GLM is the authoritative serialization.
        meaning: dcterms:format
      cim_rdf:
        description: CIM RDF/XML (application/rdf+xml) is the authoritative serialization.
        meaning: dcat:mediaType

  GoldenDirectionEnum:
    permissible_values:
      native_is_golden:
        description: Native format is the reference; validate the derived CIM going in.
      cim_is_golden:
        description: CIM is the reference; validate exports going out.
