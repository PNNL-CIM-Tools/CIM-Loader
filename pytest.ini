[pytest]
# Pytest configuration for CIM-Loader integration tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short

# Test markers for different database types
markers =
    integration: Integration tests requiring external services (docker-compose)
    blazegraph: Tests for Blazegraph triplestore
    neo4j: Tests for Neo4j graph database
    mysql: Tests for MySQL relational database
    oxigraph: Tests for Oxigraph triplestore
    graphdb: Tests for GraphDB triplestore
    slow: Tests that take significant time to run
    requires_docker: Tests that require Docker daemon

# Test paths
testpaths = tests

# Timeout for tests (in seconds)
timeout = 300

# Ignore paths
norecursedirs = .git .venv venv env __pycache__ docker .pytest_cache htmlcov

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options
[coverage:run]
source = cimloader
omit =
    */tests/*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
